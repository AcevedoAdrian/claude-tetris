name: Claude Issue Triage

# Al abrirse (o reabrirse) un issue, Claude lo analiza, le asigna labels
# apropiados y escribe un diagnóstico general en Markdown dentro del propio
# cuerpo del issue. Ese diagnóstico sirve de insumo para implementar la
# solución más adelante (por ejemplo invocando "@claude" sobre el issue ya
# diagnosticado, que dispara claude.yml).

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # No triagear si el propio issue ya invoca a @claude explícitamente
    # (ese caso lo maneja claude.yml).
    if: |
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # necesario para editar el body y aplicar labels
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_label() {
            gh label create "$1" --color "$2" --description "$3" --force
          }
          create_label "priority:high"   "b60205" "Prioridad alta"
          create_label "priority:medium" "fbca04" "Prioridad media"
          create_label "priority:low"    "0e8a16" "Prioridad baja"
          create_label "area:gameplay"   "1d76db" "Lógica de juego (piezas, colisión, scoring, niveles)"
          create_label "area:ui"         "1d76db" "HUD, overlay, controles en pantalla"
          create_label "area:render"     "1d76db" "Renderizado en canvas"
          create_label "area:input"      "1d76db" "Manejo de teclado / controles"
          create_label "area:infra"      "1d76db" "Build, workflows, tooling, documentación de repo"
          create_label "complexity:s"    "c5def5" "Cambio pequeño y acotado"
          create_label "complexity:m"    "c5def5" "Cambio de tamaño medio"
          create_label "complexity:l"    "c5def5" "Cambio grande o riesgoso"
          create_label "needs-info"      "d4c5f9" "Falta información para poder diagnosticar o reproducir"

      - name: Run Claude triage
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label list:*)"
          prompt: |
            Estás haciendo triage automático del issue #${{ github.event.issue.number }}
            del repositorio ${{ github.repository }}.

            ## Contexto del proyecto
            Lee `CLAUDE.md` en la raíz del repo para entender la arquitectura
            (Tetris clásico en JavaScript vainilla: `index.html`, `style.css`,
            `game.js`). `game.js` es un único archivo de ~300 líneas con toda
            la lógica del juego (colisión, rotación, scoring, niveles, loop
            principal, etc.), sin clases ni módulos.

            ## Pasos

            1. Obtén el issue completo:
               `gh issue view ${{ github.event.issue.number }} --json title,body,author,labels`

            2. Lee `CLAUDE.md` y explora `game.js`, `index.html`, `style.css`
               con Read/Grep para localizar las funciones o secciones
               realmente implicadas en el problema o pedido descrito
               (por ejemplo `collide`, `tryRotate`, `lockPiece`,
               `clearLines`, `draw`, `loop`, `spawn`, `ghostY`, el HUD del
               `index.html`, etc.). No asumas nada del código sin verificarlo.

            3. Elige labels para el issue:
               - Exactamente un `priority:high` / `priority:medium` / `priority:low`.
               - Exactamente un `complexity:s` / `complexity:m` / `complexity:l`.
               - Al menos un `area:gameplay` / `area:ui` / `area:render` / `area:input` / `area:infra`.
               - Los tipos existentes que correspondan, tomados solo de esta
                 lista: `bug`, `enhancement`, `documentation`, `question`,
                 `accessibility`, `good first issue`, `help wanted`, `invalid`,
                 `duplicate`, `wontfix`.
               - Si falta información para reproducir o entender el pedido,
                 añade también `needs-info`.
               - No inventes labels que no estén en esta lista. Aplica todos
                 los labels elegidos con un único comando:
                 `gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2,..."`

            4. Redacta un diagnóstico general en **español y en formato
               Markdown**, basado en el código real que revisaste, con esta
               estructura exacta:

               ```
               <!-- claude-triage:start -->
               ---
               ## 🤖 Diagnóstico automático (Claude)

               **Tipo:** ... | **Prioridad:** ... | **Área:** ... | **Complejidad:** ...

               ### Resumen
               Una o dos frases sobre el problema o pedido real.

               ### Análisis técnico
               Qué está pasando y por qué, citando archivo:línea concretos
               (ej. `game.js:142`) cuando sea posible.

               ### Archivos y funciones implicadas
               - `archivo` → `función()`, `función()`

               ### Enfoque de solución propuesto
               1. Paso concreto
               2. Paso concreto

               ### Criterios de aceptación
               - [ ] Condición verificable
               - [ ] Condición verificable

               ### Riesgos / consideraciones
               Efectos colaterales o mecánicas que podrían romperse.

               ### Información faltante
               (Omite esta sección por completo si no falta nada.)

               <sub>Generado automáticamente al abrir el issue. Revisar antes de implementar.</sub>
               <!-- claude-triage:end -->
               ```

            5. Idempotencia: si el body actual del issue ya contiene
               `<!-- claude-triage:start -->` ... `<!-- claude-triage:end -->`,
               reemplaza ese bloque por el nuevo en lugar de duplicarlo;
               conserva intacto el resto del body original del autor. Escribe
               el body final completo (original + bloque de diagnóstico) en un
               archivo temporal y aplícalo con:
               `gh issue edit ${{ github.event.issue.number }} --body-file <archivo>`
               (evita pasar el body como argumento inline por problemas de
               escaping con backticks y saltos de línea).

            ## Restricciones

            - No modifiques código del repositorio.
            - No abras pull requests.
            - No cierres ni comentes el issue, solo edita labels y body.
            - Si el issue está vacío, es spam o no aporta información
              suficiente, aplica únicamente el label `needs-info` (más un tipo
              si es evidente) y escribe un diagnóstico breve explicando qué
              información falta.
