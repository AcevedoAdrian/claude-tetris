name: Claude Issue Triage

# Al abrirse, editarse o reabrirse un issue, Claude lo analiza, le asigna
# labels genéricas y publica un diagnóstico corto (Markdown, <=1500
# caracteres) como comentario nuevo. Ese diagnóstico sirve de insumo para
# implementar la solución más adelante (por ejemplo invocando "@claude"
# sobre el issue ya diagnosticado, que dispara claude.yml).

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # No triagear si el propio issue ya invoca a @claude explícitamente
    # (ese caso lo maneja claude.yml).
    if: |
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # necesario para comentar y aplicar labels
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude triage
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*)"
          prompt: |
            Estás haciendo triage automático del issue #${{ github.event.issue.number }}
            del repositorio ${{ github.repository }}.

            ## Contexto del proyecto
            Lee `CLAUDE.md` en la raíz del repo para entender la arquitectura
            (Tetris clásico en JavaScript vainilla: `index.html`, `style.css`,
            `game.js`, un único archivo de ~300 líneas sin clases ni módulos).

            ## Pasos

            1. Obtén el issue: `gh issue view ${{ github.event.issue.number }} --json title,body,labels`

            2. Explora `game.js`, `index.html`, `style.css` con Read/Grep
               para entender realmente el problema o pedido antes de opinar.

            3. Asigna 1-3 labels genéricas y simples (una sola palabra, en
               minúscula, sin prefijos como `area:` o `priority:`). Usa
               primero `gh label list` y reutiliza las que ya existan
               (p. ej. `bug`, `enhancement`, `documentation`, `question`,
               `accessibility`). Si ninguna encaja, crea como máximo 1 label
               nueva genérica con `gh label create` (ejemplos: `ui`, `style`,
               `performance`, `gameplay`). Aplica con:
               `gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"`

            4. Publica un **comentario nuevo** (no edites el issue) con un
               diagnóstico breve en español y Markdown, de **máximo 1500
               caracteres en total**. Sé conciso, sin relleno. Formato:

               ```
               ## 🤖 Diagnóstico automático

               **Labels:** ...

               **Resumen:** 1-2 frases del problema/pedido real.

               **Análisis:** qué pasa y por qué, citando `archivo:función`
               concretos si aplica.

               **Sugerencia:** 1-3 pasos concretos para resolverlo.
               ```

               Escribe el comentario en un archivo temporal y publícalo con:
               `gh issue comment ${{ github.event.issue.number }} --body-file <archivo>`
               (evita pasarlo inline por escaping de backticks/saltos de línea).
               Verifica que el archivo tenga 1500 caracteres o menos antes de
               publicarlo; si se pasa, recórtalo.

            ## Restricciones

            - No modifiques código del repositorio.
            - No abras pull requests.
            - No edites el body del issue ni lo cierres: solo agrega labels
              y comenta.
            - Si el issue no aporta información suficiente, dilo brevemente
              en el comentario en vez de inventar un diagnóstico.
